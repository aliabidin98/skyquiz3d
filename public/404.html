<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>SkyQuiz 3D - Mengalihkan...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Preserves paths and query parameters
      const segmentCount = 1;
      const location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body>
    <p style="text-align:center; font-family:sans-serif; margin-top:50px;">
      Memuat SkyQuiz 3D...
    </p>
  </body>
</html>
