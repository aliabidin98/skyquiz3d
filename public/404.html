<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>SkyQuiz 3D - Mengalihkan...</title>
    <style>
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>
    <script>
      // Clean redirect back to the app home page preserving any parameters
      var repoSegments = location.pathname.split('/').filter(Boolean);
      var targetPath = '/';
      if (location.hostname.endsWith('github.io') && repoSegments.length > 0) {
        targetPath = '/' + repoSegments[0] + '/';
      }
      location.replace(location.origin + targetPath + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Mengalihkan ke SkyQuiz 3D...</p>
  </body>
</html>
